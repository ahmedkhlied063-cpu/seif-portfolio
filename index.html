<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saif Wael - Physical Therapist</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Sky Blue Theme Color -->
    <link rel="stylesheet" href="designs/sky-blue.css">
</head>
<body>

    <!-- خلفية الصفحة الرئيسية المصنفرة -->
    <div class="page-bg"></div>

    <!-- ==================== Splash Screen Animation ==================== -->
    <div class="splash-screen" id="splashScreen">
        <div class="splash-bg"></div>
        
        <!-- الحرفان S و W -->
        <div class="door-container">
            <span class="letter left-letter">S</span>
            <span class="letter right-letter">W</span>
        </div>
    </div>

    <!-- ==================== Main Profile Card ==================== -->
    <div class="profile-card">
        <!-- Profile Picture -->
        <div class="avatar-container">
            <img src="image/seif.jpeg" alt="Saif Wael" class="avatar">
        </div>

        <!-- Name & Title -->
        <h1 class="name">Saif Wael</h1>
        <p class="title">Physical Therapist</p>

        <!-- Social Icons Row -->
        <div class="social-icons">
            <a href="https://www.instagram.com/saif_wael22?igsi=dmZrMWNoNDgzMjI1" target="_blank" class="icon-link" title="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="#" class="icon-link" title="WhatsApp"><i class="fab fa-whatsapp"></i></a>
            <a href="#" class="icon-link" title="Telegram"><i class="fab fa-telegram"></i></a>
        </div>

        <!-- Main Action Buttons -->
        <div class="actions">
            <!-- 1. Phone Button -->
            <a href="tel:+201000000000" class="btn" id="phoneBtn">
                <i class="fas fa-phone"></i>
                <span>Phone</span>
            </a>

            <!-- 2. Gmail Button -->
            <a href="mailto:saifwael@gmail.com" class="btn" id="emailBtn">
                <i class="fas fa-envelope"></i>
                <span>Gmail</span>
            </a>

            <!-- 3. Save Contact Button -->
            <a href="#" class="btn" id="saveContactBtn">
                <i class="fas fa-address-card"></i>
                <span>Save Contact</span>
            </a>

            <!-- 4. LinkedIn Button -->
            <a href="#" class="btn" id="linkedinBtn">
                <i class="fab fa-linkedin"></i>
                <span>LinkedIn</span>
            </a>

            <!-- Footer Call To Action Banner -->
            <div class="cta-banner">
                <span>Your Recovery Starts Here 🩺✨</span>
            </div>
        </div>
    </div>

    <!-- External JavaScript File -->
    <script src="script.js"></script>
</body>
</html>
